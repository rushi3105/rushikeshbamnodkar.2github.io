<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>For My Love ❤️</title>

<link rel="stylesheet" href="file/default.css">

<style>
#text{
position:absolute;
left:8%;
top:15%;
width:420px;
z-index:5;
}

#clock-box{
position:absolute;
top:75%;
left:8%;
color:#ffddee;
font-size:22px;
font-weight:bold;
z-index:6;
}

#canvas{
position:fixed;
top:0;
left:0;
z-index:1;
}
</style>

</head>

<body>

<audio id="myAudio" loop>
<source src="aud.mp3" type="audio/mp3">
</audio>

<div id="wrap">

<div id="text">
<div id="code">
<span class="say">From strangers… to my favorite person ❤️</span><br>
<span class="say">You are my peace after every long day 🌙</span><br>
<span class="say">No matter what happens, I’m always with you 🤝</span><br>
<span class="say">I promise to keep you smiling forever 💕</span><br>
<span class="say">I love you more than words can explain ❤️</span><br>
<span class="say">You are not just my love, you are my home 🏠❤️</span><br>
<span class="say">Happy Birthday my Wifey ❤️🎂</span><br>
</div>
</div>

<div id="clock-box">
<span id="clock"></span>
</div>

<canvas id="canvas" width="1100" height="680"></canvas>

</div>

<!-- LIBRARIES (VERY IMPORTANT — MUST BE AT BOTTOM) -->

<script src="file/jquery.min.js"></script>

<script src="file/jscex.min.js"></script>

<script src="file/jscex-parser.js"></script>

<script src="file/jscex-jit.js"></script>

<script src="file/jscex-builderbase.min.js"></script>

<script src="file/jscex-async.min.js"></script>

<script src="file/jscex-async-powerpack.min.js"></script>

<script src="file/functions.js"></script>

<script src="file/love.js"></script>

<!-- Start music on first tap -->

<script>
document.body.addEventListener("click", function(){
var audio=document.getElementById("myAudio");
audio.play().catch(()=>{});
});
</script>

<!-- Relationship Timer -->

<script>
var together=new Date();
together.setFullYear(2022,10,22);
together.setHours(0,0,0,0);

function timeElapse(date){
var seconds=(Date.now()-date)/1000;

var days=Math.floor(seconds/(3600*24));
seconds%=3600*24;
var hours=Math.floor(seconds/3600);
seconds%=3600;
var minutes=Math.floor(seconds/60);
seconds=Math.floor(seconds%60);

document.getElementById("clock").innerHTML=
days+" days "+hours+" hours "+minutes+" minutes "+seconds+" seconds ❤️";
}

setInterval(function(){timeElapse(together);},1000);
timeElapse(together);
</script>

</body>
</html>
